case:
  name: ${file}

  purpose: >
    Validate generic screenshot, download, and PDF evidence through the
    YAML-selected web adapter.

  web:
    browser: Chrome

  steps:
    - type: web
      action: navigate
      target: 'data:text/html,<title>Amber evidence fixture</title><h1 id="heading">Amber</h1><a id="download" href="data:text/plain,Amber%20fixture" download="fixture.txt">Download</a>'
      confirm: Local evidence fixture is opened.
      expectation: The local evidence fixture is available.

    - type: web
      action: screenshot
      confirm: The browser page is captured.
      expectation: Screenshot evidence is recorded.

    - type: web
      action: download
      target: download
      parameters:
        path: fixture.txt
      confirm: The fixture download link is activated.
      expectation: Download evidence is recorded.

    - type: web
      action: pdf
      parameters:
        path: evidence.pdf
      confirm: The browser page is printed.
      expectation: PDF evidence is recorded.
