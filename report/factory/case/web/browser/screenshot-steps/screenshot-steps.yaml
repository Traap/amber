case:
  name: ${file}

  purpose: Validate multiple screenshots retain distinct evidence paths.

  web:
    browser: Chrome

  steps:
    - type: web
      action: navigate
      target: fixture://web/page_mock.html
      confirm: The neutral page fixture is opened.
      expectation: The page fixture is available.

    - type: web
      action: screenshot
      confirm: The first page screenshot is captured.
      expectation: The first screenshot is retained.

    - type: web
      action: input
      target: query
      parameters:
        value: screenshot input
      confirm: Neutral input is entered.
      expectation: The input action completes.

    - type: web
      action: screenshot
      confirm: The second page screenshot is captured.
      expectation: The second screenshot is retained separately.
