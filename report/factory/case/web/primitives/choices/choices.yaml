case:
  name: ${file}

  purpose: Validate mutually exclusive choices and selection state.

  web:
    browser: Chrome
    target: fixture://web/page_mock.html#choices

  steps:
    - type: web
      confirm: >
        Choice A is selected, then replaced by Choice B while the submit
        control reflects the mutually exclusive selection state.
      actions:
        - action: assert
          target: choice-submit
          parameters:
            condition: disabled
        - action: click
          target: choice-a
        - action: assert
          target: choice-a
          parameters:
            condition: checked
        - action: assert
          target: choice-submit
          parameters:
            condition: enabled
        - action: click
          target: choice-b
        - action: assert
          target: choice-a
          parameters:
            condition: unchecked
        - action: assert
          target: choice-b
          parameters:
            condition: checked
      record: screenshot
