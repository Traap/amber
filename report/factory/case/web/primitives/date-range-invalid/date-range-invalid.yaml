case:
  name: ${file}

  purpose: Validate rejection of an end date before the start date.

  web:
    browser: Chrome
    input:
      start-date: '2026-09-20'
      end-date: '2026-09-19'

  steps:
    - type: web
      action: navigate
      target: fixture://web/page_mock.html#date-range
      confirm: The date range primitive is opened.
      expectation: The date controls are available.

    - type: web
      action: screenshot
      confirm: The invalid date page is captured.
      expectation: The shared header, date body, and footer are recorded.

    - type: web
      action: input
      target: start-date
      confirm: A start date is entered.
      expectation: The start date is accepted.

    - type: web
      action: screenshot
      confirm: The start date state is captured.
      expectation: The shared header, date body, and footer are recorded.

    - type: web
      action: input
      target: end-date
      confirm: An earlier end date is entered.
      expectation: The invalid ordering is detected.

    - type: web
      action: screenshot
      confirm: The invalid ordering state is captured.
      expectation: The shared header, date body, and footer are recorded.

    - type: web
      action: assert
      target: date-status
      parameters:
        condition: contains
        value: on or before
      confirm: The date validation message is read.
      expectation: The end date cannot precede the start date.

    - type: web
      action: screenshot
      confirm: The validation message state is captured.
      expectation: The shared header, date body, and footer are recorded.

    - type: web
      action: assert
      target: date-submit
      parameters:
        condition: disabled
      confirm: The invalid date button state is read.
      expectation: The button is disabled for an invalid range.

    - type: web
      action: screenshot
      confirm: The disabled date state is captured.
      expectation: The shared header, date body, and footer are recorded.
