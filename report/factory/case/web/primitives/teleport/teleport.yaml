case:
  name: ${file}

  purpose: Validate local navigation routes to reusable web primitives.

  web:
    browser: Chrome
    navigation_file: config/web/navigation.yaml
    input_root: config/input

  steps:
    - type: web
      action: teleport
      target: input-validation
      parameters:
        from: start
      confirm: The local navigation route is executed.
      expectation: The input validation primitive is opened.

    - type: web
      action: screenshot
      confirm: The teleported page is captured.
      expectation: The shared header, input body, and footer are recorded.
