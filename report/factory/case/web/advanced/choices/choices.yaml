case:
  name: ${file}

  purpose: Validate mutually exclusive choices and selection state.

  web:
    browser: Chrome

  steps:
    - type: web
      action: navigate
      target: fixture://web/page_mock.html#choices
      confirm: The choices primitive is opened.
      expectation: The mutually exclusive choices are available.

    - type: web
      action: assert
      target: choice-submit
      parameters:
        condition: disabled
      confirm: The initial choice button state is read.
      expectation: The button is disabled before a choice is selected.

    - type: web
      action: click
      target: choice-a
      confirm: Choice A is selected.
      expectation: The first choice can be selected.

    - type: web
      action: assert
      target: choice-a
      parameters:
        condition: checked
      confirm: Choice A selection is read.
      expectation: Choice A is selected.

    - type: web
      action: assert
      target: choice-submit
      parameters:
        condition: enabled
      confirm: The enabled choice button state is read.
      expectation: The button is enabled after a choice is selected.

    - type: web
      action: click
      target: choice-b
      confirm: Choice B is selected.
      expectation: The second choice can replace the first.

    - type: web
      action: assert
      target: choice-a
      parameters:
        condition: unchecked
      confirm: Choice A selection is read again.
      expectation: Choice A is no longer selected.

    - type: web
      action: assert
      target: choice-b
      parameters:
        condition: checked
      confirm: Choice B selection is read.
      expectation: Choice B is selected.
